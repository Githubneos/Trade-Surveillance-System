name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    runs-on: ubuntu-latest

    # Real Postgres and Redis rather than mocks. The properties this project claims --
    # idempotent writes on a UNIQUE constraint, crash recovery through a consumer group --
    # only exist in the real services; against fakes the tests would assert the fake.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: surveillance
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 3s --health-retries 20
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 20

    env:
      SURV_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/surveillance
      SURV_TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/surveillance_test
      SURV_REDIS_URL: redis://localhost:6379/0

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Create the test database
        run: PGPASSWORD=postgres createdb -h localhost -U postgres surveillance_test

      - name: Migrate
        run: alembic upgrade head

      - name: Generate the dataset
        run: python -m surveillance.cli generate --no-stats

      - name: Test
        run: pytest -q --cov=surveillance --cov-report=term-missing

      - name: Detection scorecard
        run: python -m surveillance.cli detect --no-persist

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit -p tsconfig.app.json
      - run: npx oxlint src
      - run: npm run build

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the image
        run: docker build -t trade-surveillance:ci .
      - name: Validate the compose file
        run: docker compose config
